<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="sans-serif" role="img" aria-label="HTML で適合する p の終了タグ省略が、XML では整形式の違反になる対比">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#3a6ea5"/></marker><marker id="arg" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#52606d"/></marker></defs>
<text x="30" y="42" text-anchor="start" font-size="14" font-weight="bold" fill="#1f2933">本文断片（p 終了タグなし）</text>
<rect x="30" y="60" width="260" height="110" rx="10" fill="#fff" stroke="#b8c2cc" stroke-width="1.2"/>
<text x="48" y="100" text-anchor="start" font-size="14" font-weight="normal" fill="#1f2933" font-family="ui-monospace,monospace">&lt;p&gt;前置き</text>
<text x="48" y="132" text-anchor="start" font-size="14" font-weight="normal" fill="#1f2933" font-family="ui-monospace,monospace">&lt;div&gt;本文&lt;/div&gt;</text>
<text x="30" y="204" text-anchor="start" font-size="13" font-weight="normal" fill="#52606d">XML の文書内では、</text>
<text x="30" y="228" text-anchor="start" font-size="13" font-weight="normal" fill="#52606d">後ろにも p の終了タグが必要</text>
<rect x="320" y="60" width="260" height="200" rx="12" fill="#dce9f2" stroke="#3a6ea5" stroke-width="1.2"/>
<text x="450" y="98" text-anchor="middle" font-size="17" font-weight="bold" fill="#3a6ea5">HTML（text/html）</text>
<text x="450" y="144" text-anchor="middle" font-size="15" font-weight="normal" fill="#1f2933">この省略は適合</text>
<text x="450" y="180" text-anchor="middle" font-size="15" font-weight="normal" fill="#1f2933">p と div は兄弟になる</text>
<text x="450" y="216" text-anchor="middle" font-size="15" font-weight="normal" fill="#1f2933">通常のパースを続ける</text>
<rect x="610" y="60" width="260" height="200" rx="12" fill="#f6e7e9" stroke="#b23a48" stroke-width="1.2"/>
<text x="740" y="98" text-anchor="middle" font-size="17" font-weight="bold" fill="#b23a48">XHTML（XML）</text>
<text x="740" y="144" text-anchor="middle" font-size="15" font-weight="normal" fill="#1f2933">p が閉じられていない</text>
<text x="740" y="180" text-anchor="middle" font-size="15" font-weight="normal" fill="#1f2933">整形式の違反になる</text>
<text x="740" y="216" text-anchor="middle" font-size="15" font-weight="normal" fill="#1f2933">致命的なエラー</text>
</svg>
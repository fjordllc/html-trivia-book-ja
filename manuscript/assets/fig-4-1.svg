<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" font-family="sans-serif" role="img" aria-label="html/head/body を書いていないソースから、ブラウザがそれらを補完した DOM の木を組み立てる流れの図">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#3a6ea5"/></marker><marker id="arg" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#52606d"/></marker></defs>
<text x="40" y="36" text-anchor="start" font-size="15" font-weight="bold" fill="#52606d">あなたが書いたソース</text>
<rect x="40" y="48" width="300" height="120" rx="12" fill="#fff" stroke="#b8c2cc" stroke-width="1.2"/>
<text x="60" y="86" text-anchor="start" font-size="14" font-weight="normal" fill="#1f2933" font-family="ui-monospace,monospace">&lt;title&gt;sample&lt;/title&gt;</text>
<text x="60" y="116" text-anchor="start" font-size="14" font-weight="normal" fill="#1f2933" font-family="ui-monospace,monospace">&lt;p&gt;Hello&lt;/p&gt;</text>
<text x="60" y="150" text-anchor="start" font-size="12" font-weight="normal" fill="#52606d">※ html / head / body は書いていない</text>
<line x1="360" y1="108" x2="436" y2="108" stroke="#3a6ea5" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="398" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a6ea5">解釈・補完</text>
<text x="470" y="36" text-anchor="start" font-size="15" font-weight="bold" fill="#52606d">ブラウザが作った DOM</text>
<rect x="470" y="48" width="410" height="242" rx="12" fill="#fff" stroke="#b8c2cc" stroke-width="1.2"/>
<text x="660" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a6ea5" font-family="ui-monospace,monospace">html</text>
<line x1="660" y1="100" x2="566" y2="124" stroke="#b8c2cc" stroke-width="1.5"/>
<line x1="660" y1="100" x2="754" y2="124" stroke="#b8c2cc" stroke-width="1.5"/>
<text x="566" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a6ea5" font-family="ui-monospace,monospace">head</text>
<text x="754" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a6ea5" font-family="ui-monospace,monospace">body</text>
<line x1="566" y1="140" x2="566" y2="166" stroke="#b8c2cc" stroke-width="1.5"/>
<line x1="754" y1="140" x2="754" y2="166" stroke="#b8c2cc" stroke-width="1.5"/>
<text x="566" y="182" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a6ea5" font-family="ui-monospace,monospace">title</text>
<text x="754" y="182" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a6ea5" font-family="ui-monospace,monospace">p</text>
<line x1="566" y1="190" x2="566" y2="216" stroke="#b8c2cc" stroke-width="1.5"/>
<line x1="754" y1="190" x2="754" y2="216" stroke="#b8c2cc" stroke-width="1.5"/>
<text x="566" y="236" text-anchor="middle" font-size="13" font-weight="normal" fill="#1f2933" font-family="ui-monospace,monospace">&quot;sample&quot;</text>
<text x="754" y="236" text-anchor="middle" font-size="13" font-weight="normal" fill="#1f2933" font-family="ui-monospace,monospace">&quot;Hello&quot;</text>
<text x="660" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a6ea5">html / head / body は補完された</text>
</svg>
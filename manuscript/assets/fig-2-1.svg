<rect x="330" y="30" width="260" height="170" rx="14" fill="#eef1f5" stroke="#b8c2cc" stroke-width="1.2"/>
<text x="460" y="82" text-anchor="middle" font-size="26" font-weight="bold" fill="#3a6ea5">HTTP</text>

<text x="460" y="152" text-anchor="middle" font-size="14" font-weight="normal" fill="#52606d" font-family="ui-monospace,monospace">GET /...</text>
<text x="460" y="180" text-anchor="middle" font-size="13" font-weight="normal" fill="#52606d">取得の手順</text>
<rect x="620" y="30" width="260" height="170" rx="14" fill="#dce9f2" stroke="#3a6ea5" stroke-width="1.2"/>

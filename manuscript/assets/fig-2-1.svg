<text x="750" y="152" text-anchor="middle" font-size="14" font-weight="normal" fill="#52606d" font-family="ui-monospace,monospace">&lt;a href=&quot;...&quot;&gt;</text>
<text x="750" y="180" text-anchor="middle" font-size="13" font-weight="normal" fill="#52606d">参照・見出し・本文</text>

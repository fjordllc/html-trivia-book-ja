<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" font-family="sans-serif" role="img" aria-label="URL は場所、HTTP は取得方法、HTML は中身の構造という 3 つの役割を並べた図">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#3a6ea5"/></marker><marker id="arg" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#52606d"/></marker></defs>
<rect x="40" y="30" width="260" height="170" rx="14" fill="#eef1f5" stroke="#b8c2cc" stroke-width="1.2"/>
<text x="170" y="82" text-anchor="middle" font-size="26" font-weight="bold" fill="#3a6ea5">URL</text>

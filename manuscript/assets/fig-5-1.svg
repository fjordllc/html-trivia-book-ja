<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" font-family="sans-serif" role="img" aria-label="tbody を書いていない表のソースから、ブラウザが table と tr のあいだに tbody を補完した DOM を作る流れの図">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#3a6ea5"/></marker><marker id="arg" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#52606d"/></marker></defs>
<text x="40" y="36" text-anchor="start" font-size="15" font-weight="bold" fill="#52606d">ソース（tbody なし）</text>
<rect x="40" y="48" width="300" height="120" rx="12" fill="#fff" stroke="#b8c2cc" stroke-width="1.2"/>
<text x="60" y="84" text-anchor="start" font-size="14" font-weight="normal" fill="#1f2933" font-family="ui-monospace,monospace">&lt;table&gt;</text>
<text x="78" y="112" text-anchor="start" font-size="14" font-weight="normal" fill="#1f2933" font-family="ui-monospace,monospace">&lt;tr&gt;&lt;td&gt;A&lt;/td&gt;&lt;/tr&gt;</text>
<text x="60" y="140" text-anchor="start" font-size="14" font-weight="normal" fill="#1f2933" font-family="ui-monospace,monospace">&lt;/table&gt;</text>
<line x1="360" y1="108" x2="436" y2="108" stroke="#3a6ea5" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="398" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a6ea5">補完</text>
<text x="470" y="36" text-anchor="start" font-size="15" font-weight="bold" fill="#52606d">DOM</text>
<rect x="470" y="48" width="410" height="242" rx="12" fill="#fff" stroke="#b8c2cc" stroke-width="1.2"/>
<text x="500" y="90" text-anchor="start" font-size="14" font-weight="bold" fill="#3a6ea5" font-family="ui-monospace,monospace">table</text>
<line x1="516" y1="98" x2="548" y2="120" stroke="#b8c2cc" stroke-width="1.5"/>
<rect x="548" y="106" width="150" height="26" rx="6" fill="#f4e9dc" stroke="#c9a26b" stroke-width="1.2"/>
<text x="560" y="124" text-anchor="start" font-size="14" font-weight="bold" fill="#3a6ea5" font-family="ui-monospace,monospace">tbody</text>
<text x="712" y="124" text-anchor="start" font-size="13" font-weight="bold" fill="#3a6ea5">← 補完された</text>
<line x1="566" y1="132" x2="596" y2="158" stroke="#b8c2cc" stroke-width="1.5"/>
<text x="596" y="176" text-anchor="start" font-size="14" font-weight="bold" fill="#3a6ea5" font-family="ui-monospace,monospace">tr</text>
<line x1="608" y1="184" x2="636" y2="208" stroke="#b8c2cc" stroke-width="1.5"/>
<text x="636" y="226" text-anchor="start" font-size="14" font-weight="bold" fill="#3a6ea5" font-family="ui-monospace,monospace">td</text>
<line x1="662" y1="222" x2="700" y2="222" stroke="#b8c2cc" stroke-width="1.5"/>
<text x="710" y="226" text-anchor="start" font-size="13" font-weight="normal" fill="#1f2933" font-family="ui-monospace,monospace">&quot;A&quot;</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" font-family="sans-serif" role="img" aria-label="HTML からブラウザとアクセシビリティ情報を介して支援技術へ届く経路と、サービスが取得する経路">
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#3a6ea5"/></marker><marker id="arg" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#52606d"/></marker></defs>
<rect x="30" y="120" width="180" height="90" rx="12" fill="#dce9f2" stroke="#3a6ea5" stroke-width="1.2"/>
<text x="120" y="173" text-anchor="middle" font-size="20" font-weight="bold" fill="#3a6ea5">HTML 文書</text>
<line x1="220" y1="145" x2="290" y2="75" stroke="#3a6ea5" stroke-width="2" marker-end="url(#ar)"/>
<rect x="300" y="40" width="240" height="85" rx="12" fill="#eef1f5" stroke="#b8c2cc" stroke-width="1.2"/>
<text x="420" y="75" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2933">ブラウザ</text>
<text x="420" y="102" text-anchor="middle" font-size="13" font-weight="normal" fill="#52606d">DOM・表示・情報の提供</text>
<line x1="550" y1="82" x2="635" y2="82" stroke="#3a6ea5" stroke-width="2" marker-end="url(#ar)"/>
<text x="592" y="48" text-anchor="middle" font-size="11" font-weight="normal" fill="#52606d">アクセシビリティ</text>
<text x="592" y="64" text-anchor="middle" font-size="11" font-weight="normal" fill="#52606d">情報</text>
<rect x="650" y="40" width="240" height="85" rx="12" fill="#eef1f5" stroke="#b8c2cc" stroke-width="1.2"/>
<text x="770" y="75" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2933">支援技術</text>
<text x="770" y="102" text-anchor="middle" font-size="13" font-weight="normal" fill="#52606d">読み上げ・移動・操作</text>
<line x1="220" y1="180" x2="290" y2="240" stroke="#3a6ea5" stroke-width="2" marker-end="url(#ar)"/>
<rect x="300" y="180" width="590" height="130" rx="12" fill="#eef1f5" stroke="#b8c2cc" stroke-width="1.2"/>
<text x="325" y="215" text-anchor="start" font-size="17" font-weight="bold" fill="#1f2933">HTML を取得するサービスやツール</text>
<text x="325" y="248" text-anchor="start" font-size="15" font-weight="normal" fill="#52606d">検索・保存・翻訳：本文や構造を利用</text>
<text x="325" y="279" text-anchor="start" font-size="15" font-weight="normal" fill="#52606d">カード生成：メタデータを参照する場合もある</text>
</svg>